  if(fcS){for(var fj=0;fj<list.length;fj++)if(list[fj].id===fcS){pg.servis=Math.floor(fj/PS)+1;break}fcS=null}
  paged(list,"servis").forEach(function(u){
    var ll=lastLoan(u.id),sv=lastSvc(u.id),d=u.rusakTgl?days(u.rusakTgl,today()):null;
    var rows=[["Rusak sejak",u.rusakTgl?fmt(u.rusakTgl):"-"],["Keterangan rusak",u.rusakKet||"Belum diisi"]];
    if(ll)rows.push(["Peminjam terakhir",ll.nama]);
    var kv=rows.map(function(r){return'<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>'}).join("");
    h+='<div id="sv-'+u.id+'" class="unit s-rusak"><div class="uh"><div><div class="t">'+esc(label(u))+'</div><div class="sn">No. seri: <span class="seri">'+esc(u.seri)+'</span></div></div><span class="badge bad">'+(d===null?"Rusak":d===0?"Rusak hari ini":"Rusak "+d+" hari")+'</span></div><dl class="kv">'+kv+'</dl><div class="acts"><button class="btn" data-a="svc" data-id="'+u.id+'">Selesai diservis</button>'+svcBtn(u)+'</div></div>'+(svcId===u.id?'<div class="ov"><form class="mdl" data-svc="'+u.id+'"><h2 style="flex:1 1 100%;margin:0">Selesai diservis</h2><div class="sn" style="flex:1 1 100%">'+esc(label(u))+' · <span class="seri">'+esc(u.seri)+'</span></div><div style="flex:1 1 140px"><label for="sd">Tanggal selesai servis</label><input id="sd" type="date" value="'+today()+'" required></div><div style="flex:1 1 140px"><label for="sb">Biaya servis (Rp)</label><input id="sb" type="number" min="0" inputmode="numeric" placeholder="0"></div><div style="flex:1 1 100%"><label for="sc">Catatan (opsional)</label><input id="sc" placeholder="Contoh: ganti karbon brush"></div><div class="acts"><button class="btn" type="submit">Simpan servis</button><button class="sm" type="button" data-a="cancel">Batal</button></div></form></div>':'')});
  document.getElementById("servis").innerHTML=h+pagerHtml("servis",totS)+'</div>';
}

function render(){
  renderStat();
  ["alat","pinjam","servis"].forEach(function(id){document.getElementById(id).hidden=!!page||id!==tab});
  document.getElementById("page").hidden=!page;document.querySelector("nav").hidden=!!page;document.getElementById("stat").hidden=!!page;
  if(page){renderPage();return}
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===tab)});
  if(tab==="alat")renderAlat();else if(tab==="pinjam")renderPinjam();else renderServis();
}

function goUnit(id){var u=unit(id),l=loanOf(id),tid;
  if(l){tab="pinjam";pf="semua";tid="ln-"+l.id;fcL=l.id}else if(u&&u.rusak){tab="servis";tid="sv-"+id;fcS=id}else return;
  lendId=retId=svcId=ketId=confirmId=null;page=null;render();
  var el=document.getElementById(tid);if(el){el.scrollIntoView({block:"center"});el.classList.remove("hl");void el.offsetWidth;el.classList.add("hl");setTimeout(function(){el.classList.remove("hl")},2700)}else window.scrollTo(0,0)}

document.querySelector("main").addEventListener("click",function(e){
  if(e.target.classList.contains("ov")){lendId=null;svcId=null;ketId=null;retId=null;confirmId=null;editId=null;render();return}
  var g=e.target.closest(".unit[data-go]");if(g&&!e.target.closest("button,a,input,select,label")){goUnit(g.dataset.go);return}
  var b=e.target.closest("[data-a]");if(!b)return;var id=b.dataset.id,a=b.dataset.a,u=unit(id);
  if(a==="page"){page=b.dataset.p||null;if(page==="tambah"&&!isAdmin())page=null;F.p=F.a="";pg.rp=pg.rs=1;lendId=null;retId=null;confirmId=null}else if(a==="flt"){flt=b.dataset.f;pg.alat=1}else if(a==="pg"){pg[b.dataset.k]=(pg[b.dataset.k]||1)+(+b.dataset.d)}else if(a==="fr"){F.p=F.a="";pg.rp=pg.rs=1}else if(a==="lend"){lendId=id;confirmId=null}else if(a==="cancel"){lendId=null;retId=null;svcId=null;ketId=null;confirmId=null;editId=null}
  else if(a==="ask"){if(isAdmin())confirmId=id}
  else if(a==="uedit"){if(isAdmin()){editId=id;confirmId=null;lendId=null}}
  else if(a==="del"){delUnit(id);confirmId=null;save()}
  else if(a==="wa"){addSel(id)}
  else if(a==="back"){retId=id;lendId=null}
  else if(a==="svc"){svcId=id;lendId=null;retId=null}
  render();
  if(a==="page"||a==="pg")window.scrollTo(0,0);
  if(lendId){var pi=document.getElementById("pn");if(pi)pi.focus()}

document.querySelector("main").addEventListener("submit",function(e){
  var f=e.target,id=f.dataset.lend,rid=f.dataset.ret,sid=f.dataset.svc,kid=f.dataset.ket,did=f.dataset.del,eid=f.dataset.edit;
  if(eid){e.preventDefault();if(!isAdmin())return;var eu=unit(eid);if(!eu)return;
    var en=document.getElementById("eun").value.trim(),em=document.getElementById("eum").value.trim(),es=document.getElementById("eus").value.trim(),ee=document.getElementById("eue");

    var dp=S.units.filter(function(x){return x.id!==eid&&x.seri.toLowerCase()===es.toLowerCase()})[0];
    if(dp){ee.textContent="Nomor seri "+es+" sudah dipakai oleh "+label(dp)+".";return}
    if(en!==eu.nama||em!==(eu.merek||"")||es!==eu.seri){eu.nama=en;eu.merek=em;eu.seri=es;W(patchInfo(eu))}
    editId=null;save();render()}
  else if(did){e.preventDefault();
    if(isAdmin())delUnit(did);
    confirmId=null;save();render()}
  else if(sid){e.preventDefault();var su=unit(sid);
    var sg=document.getElementById("sd").value,sbi=parseInt(document.getElementById("sb").value)||0,sct=document.getElementById("sc").value.trim();
    var ns={id:uid(),unit:sid,rusak:su.rusakTgl||"",ket:su.rusakKet||"",selesai:sg,biaya:sbi,catatan:sct,pj:(lastLoan(sid)||{}).nama||""};S.services.push(ns);
    su.rusak=false;su.rusakTgl="";su.rusakKet="";W(up("ak_service",sRow(ns)).then(function(){return patchSt(su)}));svcId=null;save();render()}
  else if(id){e.preventDefault();
    var nm=norm(document.getElementById("pn").value),tg=document.getElementById("pt").value,tk=document.getElementById("pk").value;
    var psI=document.getElementById("ps"),sp=psI.value.trim(),lk=norm(document.getElementById("pl").value),md=norm(document.getElementById("pm").value),pe=document.getElementById("pe");
    if(!nm||loanOf(id))return;
    if(!sp||!lk||!tk){pe.textContent="Semua isian wajib diisi kecuali mandor.";return}
    if(tk&&tk<tg){pe.textContent="Tanggal kembali tidak boleh sebelum tanggal pinjam.";return}
    var fin=function(spk){var nl={id:uid(),unit:id,nama:nm,mandor:md,spk:spk,lok:lk,tgl:tg,rencana:tk,back:null};S.loans.push(nl);W(up("ak_loan",lRow(nl)));lendId=null;save();render()};
    if(psI.dataset.ok&&psI.dataset.ok.toLowerCase()===sp.toLowerCase()){fin(psI.dataset.ok);return}
    pe.textContent="Memeriksa No. SPK\u2026";
    sb("spk?select=no_spk&no_spk=ilike."+encodeURIComponent(sp.replace(/[%_*,()\\]/g,""))+"&limit=1").then(function(r){
      if(r&&r.length){fin(r[0].no_spk)}else{var e2=document.getElementById("pe");if(e2)e2.textContent="No. SPK \""+sp+"\" tidak ada di tabel SPK. Pilih dari daftar."}
    },function(er){var e2=document.getElementById("pe");if(e2)e2.textContent="Gagal memeriksa SPK: "+(er&&er.message||er)})}
  else if(rid){e.preventDefault();
    var tb=document.getElementById("rb").value;
    S.loans.forEach(function(l){if(l.id!==rid)return;if(tb<l.tgl){document.getElementById("re").textContent="Tanggal kembali tidak boleh sebelum tanggal pinjam ("+fmt(l.tgl)+").";return}var kd=document.getElementById("rk").value==="rusak",kt=document.getElementById("rket").value.trim();if(kd&&!kt){document.getElementById("re").textContent="Isi keterangan rusak karena apa.";return}l.back=tb;W(up("ak_loan",lRow(l)));if(kd){var ru=S.units.filter(function(x){return x.id===l.unit})[0];if(ru){ru.rusak=true;ru.rusakTgl=tb;ru.rusakKet=kt;W(patchSt(ru))}}retId=null;save();render()})}
});
